command_timeout = 2000

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$nodejs\
$java\
$kotlin\
$rust\
$cmd_duration\
$line_break\
$character"""

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold purple"

[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '
style = "bold red"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold yellow"
conflicted = "⚡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "\\$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[cmd_duration]
min_time = 2_000
format = "[ $duration]($style) "
style = "bold yellow"

[python]
python_binary = ["python3", "python"]
format = '[$symbol$version]($style) '
symbol = " "
style = "bold yellow"

[nodejs]
format = '[$symbol$version]($style) '
symbol = " "
style = "bold green"

[java]
format = '[$symbol$version]($style) '
symbol = " "
style = "bold red"

[kotlin]
format = '[$symbol$version]($style) '
symbol = " "
style = "bold blue"

[rust]
format = '[$symbol$version]($style) '
symbol = " "
style = "bold orange"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
