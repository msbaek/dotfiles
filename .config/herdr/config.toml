onboarding = false
# ~/.config/herdr/config.toml
# msbaek: craftzdog's herdr config merged with my tmux habits (prefix C-a).
# Decisions: see note section 7.0. Key-name sources: (official) / (author) / (renamed by me).
# No arrow keys anywhere: main keyboard is a keeb.io Iris SE.

# Enable after the first run (integrations screen seen once).
# onboarding = false

[theme]
# Match the pane body (Ghostty Atom One Light): one-light, no dark overrides.
# Tried 2026-11-06: "terminal" (dim text invisible), catppuccin mocha chrome (sidebar looked odd).
# Other built-in light themes: gruvbox-light, solarized-light, catppuccin-latte,
# tokyo-night-day, kanagawa-lotus, rose-pine-dawn.
name = "one-light"
auto_switch = false

# Navigate mode (prefix+w) cursor row in the sidebar. One-light's default is too
# faint to tell "I am navigating the sidebar" from a normal row.
[theme.custom]
selection_bg = "#ffd866"
# Focused pane border = accent token (src/ui/panes.rs: focused -> palette.accent, else overlay0).
# one-light accent #4078f2 is too faint next to the #a0a1a7 unfocused gray; no border-width option exists.
# Side effect: active tab / sidebar highlight also use accent.
accent = "#ff5f00"

[ui]
pane_gaps = false                            # author
hide_tab_bar_when_single_tab = true          # author
tab_bar_position = "top"                  # author; matches the video layout
copy_on_select = false                       # author; same intent as my tmux MouseDragEnd1Pane unbind
# sidebar_start_collapsed = true             # author. Keep the sidebar visible while evaluating; toggle with prefix+b
sidebar_width = 20                           # author
window_title = "{workspace}: {terminal_title}"   # author; AeroSpace matches Ghostty windows by title

status_indicators = "symbols" # dots
[ui.toast]
delivery = "herdr"   # mine 2026-11-08: macOS Notification Center (osascript/terminal-notifier); was "herdr" (in-app toast only). "terminal": Ghostty에 osc 데스크톱 알림 요청

[ui.sound]
enabled = true

# Author: show Claude's session summary (terminal title) instead of the agent name.
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "machine", "workspace", "tab"], ["terminal_title_stripped"]]

[terminal]
new_cwd = "follow"                           # author; tmux -c "#{pane_current_path}"

[keys]
prefix = "ctrl+a"                            # mine (author: ctrl+t). Verify readline Ctrl+A loss (section 10.5).

reload_config = "prefix+r"                   # mine + author. Default prefix+r is resize_mode, so move it.
                                             # NOTE: `herdr server reload-config` reloads the server only; direct chords (ctrl+alt+hjkl) are client keybindings and need THIS key (prefix+r) in the TUI.
resize_mode   = "prefix+shift+r"             # author

detach     = "prefix+d"                      # author (= tmux default)
rename_tab = "prefix+comma"                  # author
close_tab  = "prefix+&"                      # author (key string: author-config only)
last_pane  = "prefix+;"                      # author
copy_mode  = ["prefix+y", "prefix+["]        # mine (y) + author ([)
zoom       = ["prefix+m", "prefix+z"]        # mine (m)

# Focus = prefix+hjkl (author, herdr default). Resize = prefix+shift+hjkl (author, below).
focus_pane_left  = ["prefix+h", "ctrl+cmd+h"]   # ctrl+cmd: 2026-11-07 (was ctrl+alt; cmd delivery verified by cmd+shift+h/l workspace keys)
focus_pane_down  = ["prefix+j", "ctrl+cmd+j"]
focus_pane_up    = ["prefix+k", "ctrl+cmd+k"]
focus_pane_right = ["prefix+l", "ctrl+cmd+l"]

# Tab order. Author: ctrl+shift+left/right. Renamed to letters (no arrows): tmux-style < and >.
move_tab_previous = "prefix+<"               # renamed by me (unverified key name)
move_tab_next     = "prefix+>"               # renamed by me (unverified key name)

# Workspace switching (author; no arrows, kept as is)
# previous_workspace = ["ctrl+shift+[", "ctrl+{"]
# next_workspace     = ["ctrl+shift+]", "ctrl+}"]
previous_workspace = ["cmd+shift+h", "ctrl+{"]
next_workspace     = ["cmd+shift+l", "ctrl+}"]

# Splits. herdr naming is inverted from tmux:
# tmux split -h (side by side) = split_vertical, tmux split -v (stacked) = split_horizontal.
split_vertical   = ["prefix+|", "prefix+%", "prefix+backslash"]   # author
split_horizontal = ["prefix+minus", 'prefix+"', "prefix+_"]       # author

goto = "prefix+u"                            # author; same key as my tmux-claude-hatch picker

# Navigate mode (after prefix+w): vim keys instead of Up/Down. Enter selects, Esc cancels.
navigate_workspace_up   = "k"
navigate_workspace_down = "j"
open_notification_target = "prefix+shift+o"  # author

# Defaults kept as-is (same as tmux):
#   prefix+c new tab, prefix+n/p next/previous tab, prefix+1..9 switch tab,
#   prefix+w workspace picker, prefix+x close pane
# herdr-only defaults: prefix+b toggle sidebar, prefix+? keybinding help
# prefix+g is NOT goto here (author binds it to lazygit, below).

# ---- author's custom commands ----

# Open current directory in Finder
[[keys.command]]
key = "prefix+o"
type = "shell"
command = 'open "$HERDR_ACTIVE_PANE_CWD"'

# Kill all other panes in the current tab (tmux: kill-pane -a)
[[keys.command]]
key = "prefix+e"
type = "shell"
command = '''herdr pane list | jq -r --arg t "$HERDR_ACTIVE_TAB_ID" --arg p "$HERDR_ACTIVE_PANE_ID" '.result.panes[] | select(.tab_id == $t and .pane_id != $p) | .pane_id' | xargs -n1 herdr pane close'''

# lazygit in a new pane (author)
[[keys.command]]
key = "prefix+g"
type = "pane"
command = 'cd "$HERDR_ACTIVE_PANE_CWD" && lazygit'

# yazi in a new pane (mine, mirrors prefix+g lazygit)
[[keys.command]]
key = "prefix+f"
type = "pane"
command = 'cd "$HERDR_ACTIVE_PANE_CWD" && yazi'

# herdr-file-viewer plugin (mine, trial 2026-11-08): read-only git-aware viewer.
# prefix+f is yazi, so use prefix+v (split) / prefix+shift+v (tab).
[[keys.command]]
key = "prefix+v"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "file viewer (split)"

[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "file viewer (tab)"

# reviewr plugin (persiyanov.reviewr, 2026-11-08): review agent diffs beside the chat, send line
# comments to the agent input. README suggests cmd+r; kept under prefix like the other pane tools.
# prefix+r is reload_config, so use prefix+i ("inspect").
[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr (toggle pane)"

# tmux-pain-control style resizing (author)
[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = 'herdr pane resize --direction left --pane "$HERDR_ACTIVE_PANE_ID"'

[[keys.command]]
key = "prefix+shift+j"
type = "shell"
command = 'herdr pane resize --direction down --pane "$HERDR_ACTIVE_PANE_ID"'

[[keys.command]]
key = "prefix+shift+k"
type = "shell"
command = 'herdr pane resize --direction up --pane "$HERDR_ACTIVE_PANE_ID"'

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = 'herdr pane resize --direction right --pane "$HERDR_ACTIVE_PANE_ID"'

# Move the current workspace up/down in the list.
# Author: ctrl+shift+up/down. Renamed to letters (no arrows).
[[keys.command]]
key = "prefix+{"                             # renamed by me (unverified key name)
type = "shell"
command = '"$HOME/bin/herdr-move-workspace" up'

[[keys.command]]
key = "prefix+}"                             # renamed by me (unverified key name)
type = "shell"
command = '"$HOME/bin/herdr-move-workspace" down'

# ---- my tmux popups ----

# lazygit popup (my tmux: prefix G). Coexists with author's prefix+g pane.
[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "lazygit"
description = "lazygit (popup)"
width = "90%"
height = "90%"

# yazi popup (mine, mirrors prefix+shift+g lazygit popup)
[[keys.command]]
key = "prefix+shift+f"
type = "popup"
command = "yazi"
description = "yazi (popup)"
width = "90%"
height = "90%"

# abtop hub (my tmux: prefix a). Unverified in popup.
[[keys.command]]
key = "prefix+a"
type = "popup"
command = "abtop"
description = "abtop"
width = "90%"
height = "85%"

[experimental]
# Author (2026-11-04): replay recent pane output after a server restart/reboot.
# Output may contain secrets or tokens; stored in ~/.config/herdr/session-history.json (not in git).
pane_history = true

# Korean IME on macOS. Whether these are needed is unverified; enable if the
# candidate window does not follow the cursor in Claude Code, or prefix keys
# are read as Korean jamo.
# switch_ascii_input_source_in_prefix = true
# reveal_hidden_cursor_for_cjk_ime = true
